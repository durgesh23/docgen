# Ford Release Notes Template Configuration
# Matches the style of Ford ECG2 VECU Release Notes

name: "Ford Release Notes"
version: "1.0"
description: "Professional release notes format matching Ford ECG2 VECU Release Notes style"

# Page settings
page:
  size: "LETTER"          # LETTER (8.5 x 11 inches)
  orientation: "portrait"
  margins:
    top: 72               # 1 inch (72 points)
    bottom: 72
    left: 72
    right: 72

# Document structure
structure:
  title_page: true        # Generate a title page
  table_of_contents: true
  toc_depth: 2           # Include h1 and h2 in TOC

# Title page configuration (matches Ford ECG2 VECU Release Notes style)
title_page:
  enabled: true
  elements:
    # Branding at top (y=596.8 in sample PDF - left aligned)
    - type: "text"
      content: "Verification Continuum™"
      position: "absolute"
      y_offset: 597         # Page y coordinate
      style: "title_page_branding"
    
    # Main title just below branding (y=567 in sample PDF - left aligned)
    - type: "text"
      content: "{title}"
      position: "absolute"
      y_offset: 567         # Page y coordinate
      style: "title_page_title"
    
    # Version near bottom (y=157.8 in sample PDF - right aligned)
    - type: "text"
      content: "Version {version}"
      position: "absolute"
      y_offset: 158         # Page y coordinate
      style: "title_page_version"
    
    # Date below version (y=144.2 in sample PDF - right aligned)
    - type: "text"
      content: "{date}"
      position: "absolute"
      y_offset: 144         # Page y coordinate
      style: "title_page_date"
  
# Metadata fields expected
metadata_fields:
  - title
  - version
  - date
  - author
  - confidentiality
  - document_number
  - revision

# Content settings
content:
  hyphenation: false
  justify: false          # Left-aligned text
  first_line_indent: 0
