# Ford Release Notes - Header and Footer Configuration

# Header configuration
header:
  enabled: true
  height: 45               # Height in points
  first_page: false        # Don't show header on title page
  
  # Margins within header area
  padding:
    top: 5
    bottom: 5
    left: 0
    right: 0
  
  # Odd page header elements (page 1, 3, 5, ...)
  odd_elements:
    - type: "text"
      content: "{chapter_number}. {chapter_name}"
      position: "left"
      style: "header_text"
      max_width: 300
    
    - type: "text"
      content: "{section_number} {section_name}"
      position: "right"
      style: "header_text"
    
    - type: "line"
      position: "bottom"
      color: "#5a428c"
      width: 1.5
      margin_top: 8
  
  # Even page header elements (page 2, 4, 6, ...)
  even_elements:
    - type: "text"
      content: "{section_number} {section_name}"
      position: "left"
      style: "header_text"
      max_width: 300
    
    - type: "text"
      content: "{chapter_number}. {chapter_name}"
      position: "right"
      style: "header_text"
    
    - type: "line"
      position: "bottom"
      color: "#5a428c"
      width: 1.5
      margin_top: 8

# Footer configuration
footer:
  enabled: true
  height: 50               # Height in points (increased for two lines)
  first_page: false        # Don't show footer on title page
  
  # Margins within footer area
  padding:
    top: 5
    bottom: 5
    left: 0
    right: 0
  
  # Odd page footer elements (page 1, 3, 5, ...)
  odd_elements:
    - type: "line"
      position: "top"
      color: "#5a428c"
      width: 1
      margin_bottom: 8
    
    # Version and date on the left (two lines)
    - type: "text"
      content: "{version}\n{month} {year}"
      position: "left"
      style: "footer_text"
      multiline: true
    
    # Synopsys, Inc. in middle
    - type: "text"
      content: "Synopsys, Inc."
      position: "center"
      style: "footer_text"
    
    # Page number on the right with purple box
    - type: "text"
      content: "{page_number}"
      position: "right"
      style: "page_number"
      y_offset: 8
      background:
        color: "#5a428c"
        text_color: "#FFFFFF"
        padding: 12
        square: true
        line_intersect: true
        intersect_position: 0.75
  
  # Even page footer elements (page 2, 4, 6, ...)
  even_elements:
    - type: "line"
      position: "top"
      color: "#5a428c"
      width: 1
      margin_bottom: 8
    
    # Page number on the left with purple box
    - type: "text"
      content: "{page_number}"
      position: "left"
      style: "page_number"
      y_offset: 8
      background:
        color: "#5a428c"
        text_color: "#FFFFFF"
        padding: 12
        square: true
        line_intersect: true
        intersect_position: 0.75
    
    # Synopsys, Inc. in middle
    - type: "text"
      content: "Synopsys, Inc."
      position: "center"
      style: "footer_text"
    
    # Version and date on the right (two lines)
    - type: "text"
      content: "{version}\n{month} {year}"
      position: "right"
      style: "footer_text"
      multiline: true

# Page numbering settings
page_numbers:
  format: "numeric"        # numeric, roman, alpha
  start_from: 1
  include_total: false
